plugins {
    id "fabric-loom" version "1.14.10"
}

version = "1.0.0"
group = "io.github.bmiddha.fabricator"

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1"
    modCompileOnly "maven.modrinth:waystones:Ub2AL65v"
    modCompileOnly "maven.modrinth:balm:R6U3hZRZ"
    modCompileOnly "maven.modrinth:bluemap:Dr2hvJBc"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "maven.modrinth:bluemap:Dr2hvJBc"
    testRuntimeOnly "com.flowpowered:flow-math:1.0.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

test { useJUnitPlatform() }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
