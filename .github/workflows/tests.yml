name: Tests

# Gate for merges: the backend suite must pass on every pull request. Mark the
# "pytest" job as a required status check in the branch protection rules.
on:
  pull_request:
  push:
    branches: [dev]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the suite
        run: python -m pytest -q

  dns-provider:
    name: DNS webhook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dns-provider/go.mod
          cache-dependency-path: dns-provider/go.sum
      - name: Verify webhook and provider adapters
        working-directory: dns-provider
        run: go test ./... && go vet ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
